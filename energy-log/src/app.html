<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Energy Log">
<meta name="description" content="Daily energy, sleep and habits log. Works offline; data stays on this device.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f7d6d'/%3E%3Cpath d='M36 8 18 36h12l-4 20 20-30H34z' fill='%23fff'/%3E%3C/svg%3E">
<title>Energy Log</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#efede7; --text:#1d1f23; --muted:#686c73; --line:#e3e0d8;
  --accent:#2f7d6d; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --energy:#d97a1e; --energy-soft:#fbe9d6; --sleep:#4f63d6; --sleep-soft:#e3e7fb;
  --danger:#b8403a; --danger-soft:#f8e3e0; --warn-soft:#fbf1dc; --warn-ink:#7a5410;
  --grid:#e9e6df; --shadow:0 1px 2px rgba(20,20,20,.05),0 4px 16px rgba(20,20,20,.04);
  --r:18px; --tap:52px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171b; --surface:#1e2126; --surface-2:#272a31; --text:#eceae6; --muted:#a0a4ab; --line:#30343b;
    --accent:#4fb39d; --accent-ink:#0d1f1b; --accent-soft:#1d3833;
    --energy:#f0a050; --energy-soft:#3a2a1a; --sleep:#8b9cf5; --sleep-soft:#252b48;
    --danger:#ec7d74; --danger-soft:#3b2220; --warn-soft:#3a3020; --warn-ink:#f1cf8a;
    --grid:#2b2f36; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171b; --surface:#1e2126; --surface-2:#272a31; --text:#eceae6; --muted:#a0a4ab; --line:#30343b;
  --accent:#4fb39d; --accent-ink:#0d1f1b; --accent-soft:#1d3833;
  --energy:#f0a050; --energy-soft:#3a2a1a; --sleep:#8b9cf5; --sleep-soft:#252b48;
  --danger:#ec7d74; --danger-soft:#3b2220; --warn-soft:#3a3020; --warn-ink:#f1cf8a;
  --grid:#2b2f36; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:24px;line-height:1.2;margin:4px 0 14px;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hidden{display:none!important}

/* buttons */
.btn{min-height:var(--tap);padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn svg{width:22px;height:22px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 10px}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:14px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:22px;height:22px}
.icon-btn:disabled{opacity:.35}
.icon-btn.danger{color:var(--danger)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}

/* date bar */
.datebar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.datepick{position:relative;flex:1;min-height:var(--tap);display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 8px;text-align:center}
.datepick .d1{font-weight:700;font-size:17px;line-height:1.2}
.datepick .d2{font-size:13px;color:var(--muted)}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;cursor:pointer}

/* streak */
.streak{display:flex;align-items:center;gap:12px}
.streak .num{font-size:30px;font-weight:800;line-height:1;color:var(--energy);min-width:44px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:999px;border:1px dashed var(--danger);background:transparent;color:var(--danger);font-size:14px;font-weight:600}
.chip.partial{border-style:solid;border-color:var(--line);color:var(--muted)}

.banner{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);color:var(--warn-ink);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.banner p{margin:0 0 10px}
.banner .row{flex-wrap:wrap}

/* segmented */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:46px;border:0;border-radius:11px;background:transparent;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg .tick{color:var(--accent);font-weight:800}

/* form */
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.label .opt{font-weight:400;color:var(--muted)}
.input,textarea.input{width:100%;min-height:var(--tap);border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;font-size:17px}
textarea.input{min-height:64px;resize:vertical;line-height:1.35}
input[type=time].input,input[type=date].input{appearance:none;-webkit-appearance:none;font-size:20px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.sleepcalc{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--sleep-soft);color:var(--sleep);font-weight:700}
.sleepcalc .warn{font-weight:500;font-size:13px}

.energy-head{display:flex;justify-content:space-between;align-items:baseline}
.energy-val{font-size:40px;font-weight:800;color:var(--energy);line-height:1;font-variant-numeric:tabular-nums}
.energy-word{font-weight:600;color:var(--muted);margin-left:8px;font-size:15px}
input[type=range]{width:100%;height:44px;-webkit-appearance:none;appearance:none;background:transparent;margin:6px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--energy) 0 var(--p,50%),var(--surface-2) var(--p,50%) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--surface);border:3px solid var(--energy);margin-top:-12px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:var(--surface-2)}
input[type=range]::-moz-range-progress{height:10px;border-radius:6px;background:var(--energy)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--surface);border:3px solid var(--energy)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 6px}

.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.quick button{min-height:var(--tap);border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px;padding:0 2px;white-space:nowrap;min-width:0}
.meals{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.meal{display:flex;gap:8px;align-items:center}
.meal .tag{flex:none;width:84px;font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
.meal .input{min-height:46px;padding:10px 12px;font-size:16px}
.meal .icon-btn{width:46px;height:46px}
.other-add{margin-top:8px}

.stepper{display:flex;align-items:center;justify-content:space-between;gap:4px}
.stepper button{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:26px;font-weight:500;line-height:1}
.stepper output{font-size:26px;font-weight:800;min-width:0;flex:1;text-align:center;font-variant-numeric:tabular-nums}
.steppers{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.steppers .box{border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px}
.steppers .label{text-align:center}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{min-height:var(--tap);border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.yn button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.saved-note{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}

/* history */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .title{font-weight:700;font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 4px;font-weight:600}
.cal .day{position:relative;aspect-ratio:1/1;min-height:42px;border-radius:11px;border:1px solid var(--line);background:color-mix(in srgb,var(--energy) calc(var(--lvl,0)*100%),var(--surface));display:flex;align-items:flex-start;justify-content:flex-start;padding:5px 6px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.cal .day.out{visibility:hidden}
.cal .day.future{opacity:.35;pointer-events:none}
.cal .day.missed{border:1.5px dashed var(--danger);background:transparent;color:var(--danger)}
.cal .day.today{outline:2px solid var(--text);outline-offset:1px}
.cal .day.hi{color:#1d1f23}
.cal .dots{position:absolute;left:0;right:0;bottom:5px;display:flex;justify-content:center;gap:3px}
.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--text);opacity:.7}
.cal .dots i.off{background:transparent;border:1px solid var(--text);opacity:.4}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:12px;align-items:center}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.ramp{display:inline-flex;gap:2px;vertical-align:-2px;margin:0 4px}
.ramp span{width:10px;height:12px;border-radius:3px}
.daylist{display:flex;flex-direction:column;gap:8px}
.month-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 4px 2px}
.daycard{display:flex;gap:8px;align-items:stretch}
.daycard .main{flex:1;min-width:0;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:var(--tap)}
.daycard.empty .main{border-style:dashed;background:transparent}
.dc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dc-date{font-weight:700}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.badge.e{background:var(--energy-soft);color:var(--energy)}
.badge.s{background:var(--sleep-soft);color:var(--sleep)}
.dc-sub{font-size:13px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dc-missing{font-size:14px;color:var(--danger);margin-top:2px}

/* dashboard */
.ranges{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-bottom:10px}
.ranges button{min-height:44px;padding:0 2px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap}
.ranges button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.custom{margin-bottom:12px}
.custom .input{font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .k{font-size:13px;color:var(--muted);font-weight:600}
.tile .v{font-size:26px;font-weight:800;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .u{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
.tile.e .v{color:var(--energy)}
.tile.s .v{color:var(--sleep)}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.chart-head .seg{margin:0;padding:3px}
.chart-head .seg button{min-height:36px;padding:0 10px;font-size:13px}
.keyline{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:6px}
.keyline i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
canvas.chart{width:100%;height:230px;display:block;touch-action:pan-y}
.readout{min-height:22px;font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
.up{color:var(--accent);font-weight:700}
.down{color:var(--danger);font-weight:700}
.pattern{padding:10px 0;border-bottom:1px solid var(--line)}
.pattern:last-child{border-bottom:0;padding-bottom:0}
.pattern:first-of-type{padding-top:0}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px;margin-top:6px}
.bar{height:10px;border-radius:5px;background:var(--energy)}
.bar.b{background:color-mix(in srgb,var(--energy) 45%,var(--surface-2))}
.bw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bw .side{border-radius:14px;padding:12px;border:1px solid var(--line);min-width:0}
.bw .side.best{background:var(--accent-soft);border-color:transparent}
.bw .side.worst{background:var(--danger-soft);border-color:transparent}
.bw .tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.bw .best .tag{color:var(--accent)}
.bw .worst .tag{color:var(--danger)}
.bw .big{font-size:28px;font-weight:800;line-height:1.1;margin:4px 0 2px}
.bw dl{margin:8px 0 0;font-size:13px}
.bw dt{color:var(--muted);font-size:12px;margin-top:6px}
.bw dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.empty-state{text-align:center;padding:28px 12px;color:var(--muted)}

/* backup */
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.stack{display:flex;flex-direction:column;gap:8px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;min-height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .pip{position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--danger)}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;transition:.2s;z-index:30;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:16px}
.sheet{background:var(--surface);border-radius:20px;padding:20px;width:100%;max-width:440px;margin-bottom:env(safe-area-inset-bottom)}
.sheet h3{font-size:18px}
.sheet p{color:var(--muted);margin:0 0 16px}
.sheet .stack .btn{width:100%}
@media (min-width:600px){.modal{align-items:center}.tiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:360px){.quick{grid-template-columns:repeat(2,1fr)}.meal .tag{width:66px}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';

/* ---------- constants & tiny helpers ---------- */
var KEY = 'energylog.v1';
var BACKUP_EVERY = 14;   // days
var SNOOZE_DAYS = 3;
var LOCALE = 'en-GB';
var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parse(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(s, n){ var d = parse(s); d.setDate(d.getDate()+n); return ymd(d); }
function todayKey(){ return ymd(new Date()); }
function daysBetween(a, b){ return Math.round((parse(b) - parse(a)) / 864e5); }
function fmt(s, o){ return parse(s).toLocaleDateString(LOCALE, o); }
function fmtLong(s){ return fmt(s, {weekday:'long', day:'numeric', month:'long'}); }
function fmtMed(s){ return fmt(s, {weekday:'short', day:'numeric', month:'short'}); }
function fmtShort(s){ return fmt(s, {day:'numeric', month:'short'}); }
function fmtFull(s){ return fmt(s, {day:'numeric', month:'short', year:'numeric'}); }
function toMin(t){ if(!t) return null; var p = t.split(':').map(Number); return isNaN(p[0]) ? null : p[0]*60 + (p[1]||0); }
function sleepMins(bed, wake){
  var b = toMin(bed), w = toMin(wake);
  if(b == null || w == null) return null;
  var d = w - b; if(d <= 0) d += 1440;   // bedtime before midnight wraps to the previous day
  return d;
}
function fmtDur(m){ if(m == null) return '–'; m = Math.round(m); return Math.floor(m/60) + 'h ' + pad(m%60) + 'm'; }
function fmtHrs(h){ return h == null ? '–' : fmtDur(h*60); }
function avg(a){ var v = a.filter(function(x){ return x != null && !isNaN(x); }); return v.length ? v.reduce(function(s,x){ return s+x; }, 0) / v.length : null; }

/* ---------- storage ---------- */
function blank(){ return {version:1, days:{}, meta:{createdAt:new Date().toISOString(), lastBackup:null, snoozeUntil:null}}; }
function normalize(d){
  if(!d || typeof d !== 'object' || !d.days || typeof d.days !== 'object') throw new Error('Not an Energy Log file');
  var out = {version:1, days:{}, meta:Object.assign({createdAt:new Date().toISOString(), lastBackup:null, snoozeUntil:null}, d.meta || {})};
  Object.keys(d.days).forEach(function(k){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    var v = d.days[k] || {}, e = {};
    if(v.morning && typeof v.morning === 'object'){
      var m = v.morning;
      e.morning = {bed:String(m.bed||''), wake:String(m.wake||''), energy:Math.min(10, Math.max(1, Math.round(+m.energy||5))), note:String(m.note||''), updatedAt:m.updatedAt||null};
    }
    if(v.evening && typeof v.evening === 'object'){
      var ev = v.evening;
      e.evening = {
        meals:Array.isArray(ev.meals) ? ev.meals.filter(Boolean).map(function(x){ return {type:MEAL_LABEL[x.type] ? x.type : 'other', text:String(x.text||'')}; }) : [],
        caffeine:Math.max(0, +ev.caffeine||0), alcohol:Math.max(0, +ev.alcohol||0),
        screen:ev.screen === true ? true : ev.screen === false ? false : null,
        note:String(ev.note||''), updatedAt:ev.updatedAt||null
      };
    }
    if(e.morning || e.evening) out.days[k] = e;
  });
  return out;
}
function load(){
  try{ var raw = localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw)); }
  catch(e){ console.warn('Could not read saved data', e); }
  return blank();
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); keysCache = null; return true; }
  catch(e){ toast('Couldn’t save – storage is full or blocked'); return false; }
}
var db = load();
var keysCache = null;
function sortedKeys(){ return keysCache || (keysCache = Object.keys(db.days).sort()); }
function firstKey(){ return sortedKeys()[0] || null; }
function hasAny(k){ var e = db.days[k]; return !!(e && (e.morning || e.evening)); }
function requestPersistentStorage(){ try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){} }

/* ---------- derived data ---------- */
function rec(k){
  var e = db.days[k] || {}, m = e.morning || null, ev = e.evening || null;
  var sm = m ? sleepMins(m.bed, m.wake) : null;
  var prev = db.days[addDays(k,-1)];
  return {k:k, m:m, ev:ev, sleepMin:sm, sleep:sm == null ? null : sm/60, energy:m ? m.energy : null,
    caffeine:ev ? ev.caffeine : null, alcohol:ev ? ev.alcohol : null, screen:ev ? ev.screen : null,
    prevEv:prev && prev.evening ? prev.evening : null};
}
function rangeRecs(from, to){ var out = []; for(var d = from; d <= to; d = addDays(d,1)) out.push(rec(d)); return out; }
function weekStart(k){ var d = parse(k); d.setDate(d.getDate() - (d.getDay()+6)%7); return ymd(d); }
function weekly(recs){
  var map = new Map();
  recs.forEach(function(r){ var w = weekStart(r.k); if(!map.has(w)) map.set(w, []); map.get(w).push(r); });
  var out = [];
  map.forEach(function(rs, w){
    out.push({start:w, end:addDays(w,6), days:rs.length, logged:rs.filter(function(r){ return r.m || r.ev; }).length,
      energy:avg(rs.map(function(r){ return r.energy; })), sleep:avg(rs.map(function(r){ return r.sleep; })),
      caffeine:avg(rs.map(function(r){ return r.caffeine; })), alcohol:avg(rs.map(function(r){ return r.alcohol; }))});
  });
  for(var i = 0; i < out.length; i++){
    var p = out[i-1];
    out[i].dEnergy = p && p.energy != null && out[i].energy != null ? out[i].energy - p.energy : null;
    out[i].dSleep = p && p.sleep != null && out[i].sleep != null ? out[i].sleep - p.sleep : null;
  }
  return out;
}
function summary(recs){
  var ev = recs.filter(function(r){ return r.ev; });
  var scr = ev.filter(function(r){ return r.screen != null; });
  return {
    days:recs.length, logged:recs.filter(function(r){ return r.m || r.ev; }).length,
    mornings:recs.filter(function(r){ return r.m; }).length, evenings:ev.length,
    energy:avg(recs.map(function(r){ return r.energy; })), sleep:avg(recs.map(function(r){ return r.sleep; })),
    caffeine:avg(recs.map(function(r){ return r.caffeine; })), alcohol:avg(recs.map(function(r){ return r.alcohol; })),
    screenPct:scr.length ? scr.filter(function(r){ return r.screen; }).length / scr.length * 100 : null
  };
}
function streakInfo(){
  var t = todayKey(), d = hasAny(t) ? t : addDays(t,-1), n = 0;
  while(hasAny(d)){ n++; d = addDays(d,-1); }
  var best = 0, run = 0, prev = null;
  sortedKeys().forEach(function(k){ run = prev && daysBetween(prev,k) === 1 ? run+1 : 1; if(run > best) best = run; prev = k; });
  return {current:n, best:best, todayDone:hasAny(t)};
}
function gaps(limitDays){
  var f = firstKey(); if(!f) return [];
  var t = todayKey(), start = f, out = [];
  if(limitDays){ var s = addDays(t, -limitDays); if(s > start) start = s; }
  for(var d = start; d < t; d = addDays(d,1)){
    var e = db.days[d];
    if(!e) out.push({k:d, type:'none'});
    else if(!e.morning) out.push({k:d, type:'morning'});
    else if(!e.evening) out.push({k:d, type:'evening'});
  }
  return out;
}
function missedTotal(){ return gaps(0).filter(function(g){ return g.type === 'none'; }).length; }
function lastMorningBefore(k){
  var keys = sortedKeys();
  for(var i = keys.length-1; i >= 0; i--){ if(keys[i] < k && db.days[keys[i]].morning) return db.days[keys[i]].morning; }
  for(i = keys.length-1; i >= 0; i--){ if(db.days[keys[i]].morning) return db.days[keys[i]].morning; }
  return null;
}
function mealSuggestions(){
  var by = {};
  sortedKeys().slice(-120).reverse().forEach(function(k){
    var ev = db.days[k].evening; if(!ev) return;
    ev.meals.forEach(function(m){ var t = m.text.trim(); if(!t) return; (by[m.type] = by[m.type] || []); if(by[m.type].indexOf(t) < 0 && by[m.type].length < 15) by[m.type].push(t); });
  });
  return by;
}
function mealsText(ev, sep){
  if(!ev || !ev.meals.length) return '';
  return ev.meals.map(function(m){ return MEAL_LABEL[m.type] + (m.text ? ': ' + m.text : ''); }).join(sep || ' · ');
}
function bestWorst(recs){
  var e = recs.filter(function(r){ return r.energy != null; });
  if(e.length < 2) return null;
  var best = e[0], worst = e[0];
  e.forEach(function(r){
    if(r.energy > best.energy || (r.energy === best.energy && r.k > best.k)) best = r;
    if(r.energy < worst.energy || (r.energy === worst.energy && r.k > worst.k)) worst = r;
  });
  return best.energy === worst.energy ? null : {best:best, worst:worst};
}
function patterns(recs){
  var e = recs.filter(function(r){ return r.energy != null; });
  function grp(fn){ var xs = e.filter(fn); return {n:xs.length, avg:avg(xs.map(function(r){ return r.energy; }))}; }
  var defs = [
    {title:'Sleep', a:['7h or more', function(r){ return r.sleep != null && r.sleep >= 7; }], b:['Under 7h', function(r){ return r.sleep != null && r.sleep < 7; }]},
    {title:'Screens after 10pm (night before)', a:['No screens', function(r){ return r.prevEv && r.prevEv.screen === false; }], b:['Screens', function(r){ return r.prevEv && r.prevEv.screen === true; }]},
    {title:'Alcohol (night before)', a:['None', function(r){ return r.prevEv && r.prevEv.alcohol === 0; }], b:['Some', function(r){ return r.prevEv && r.prevEv.alcohol > 0; }]},
    {title:'Caffeine (day before)', a:['0–1', function(r){ return r.prevEv && r.prevEv.caffeine <= 1; }], b:['2 or more', function(r){ return r.prevEv && r.prevEv.caffeine >= 2; }]}
  ];
  return defs.map(function(d){
    var A = grp(d.a[1]), B = grp(d.b[1]);
    return {title:d.title, a:{label:d.a[0], n:A.n, avg:A.avg}, b:{label:d.b[0], n:B.n, avg:B.avg}, ok:A.n >= 3 && B.n >= 3};
  });
}
function backupDue(){
  if(!firstKey()) return null;
  var now = Date.now(), last = db.meta.lastBackup;
  if(db.meta.snoozeUntil && now < Date.parse(db.meta.snoozeUntil)) return null;
  if(!last) return sortedKeys().length >= 3 ? {never:true} : null;
  var since = Math.floor((now - Date.parse(last)) / 864e5);
  return since >= BACKUP_EVERY ? {days:since} : null;
}

/* ---------- ui state ---------- */
var state = {
  view:'log', logDate:todayKey(), half:null, lastToday:todayKey(),
  histMonth:todayKey().slice(0,7), histMode:'month', histLimit:60,
  range:{preset:'30', from:null, to:null}, chartMode:'auto', hi:null
};
function defaultHalf(k){
  // mornings before 3pm, evenings after; if that half is done but the other isn't, show the other
  var e = db.days[k] || {};
  var pref = k === todayKey() && new Date().getHours() >= 15 ? 'evening' : 'morning';
  var other = pref === 'morning' ? 'evening' : 'morning';
  return e[pref] && !e[other] ? other : pref;
}
function resolveRange(){
  var t = todayKey(), p = state.range.preset;
  if(p === 'all') return {from:firstKey() || t, to:t};
  if(p === 'custom'){
    var f = state.range.from || addDays(t,-29), to = state.range.to || t;
    if(f > to){ var x = f; f = to; to = x; }
    return {from:f, to:to};

/* ---------- toast & modal ---------- */
var toastTimer;
function toast(msg){ var el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200); }
function ask(title, body, buttons){
  return new Promise(function(res){
    var ov = document.createElement('div'); ov.className = 'modal';
    ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><h3>' + esc(title) + '</h3>' + (body ? '<p>' + esc(body) + '</p>' : '') +
      '<div class="stack">' + buttons.map(function(b, i){ return '<button class="btn ' + (b.cls||'') + '" data-i="' + i + '">' + esc(b.label) + '</button>'; }).join('') + '</div></div>';
    function done(v){ ov.remove(); document.removeEventListener('keydown', onKey); res(v); }
    function onKey(e){ if(e.key === 'Escape') done(null); }
    ov.addEventListener('click', function(e){ var b = e.target.closest('[data-i]'); if(b) done(buttons[+b.dataset.i].value); else if(e.target === ov) done(null); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
  });
}

/* ---------- rendering ---------- */
function renderTabs(){
  var due = !!backupDue();
  var tabs = [['log','Log',ICON.log],['history','History',ICON.history],['dash','Trends',ICON.dash],['backup','Backup',ICON.backup]];
  $('#tabs').innerHTML = tabs.map(function(t){
    return '<button data-act="nav" data-view="' + t[0] + '"' + (state.view === t[0] ? ' aria-current="page"' : '') + '>' + t[2] + '<span>' + t[1] + '</span>' + (t[0] === 'backup' && due ? '<span class="pip" aria-label="Backup due"></span>' : '') + '</button>';
  }).join('');
}
function render(){
  renderTabs();
  var app = $('#app');
  if(state.view === 'log') app.innerHTML = viewLog();
  else if(state.view === 'history') app.innerHTML = viewHistory();
  else if(state.view === 'dash'){ app.innerHTML = viewDash(); requestAnimationFrame(drawScreenChart); }
  else app.innerHTML = viewBackup();
  if(state.view === 'log') syncEnergy();
}

/* ---- log view ---- */
function viewLog(){

}
function sleepLabel(sm){

function monthList(){

function tile(cls, k, v, u){ return '<div class="tile ' + cls + '"><div class="k">' + k + '</div><div class="v">' + esc(v) + (u ? '<span class="u">' + u + '</span>' : '') + '</div></div>'; }

  var out = [];

  if(r.prevEv){

/* ---- chart (canvas, shared by screen + PDF) ---- */
function chartPoints(recs, mode){
  if(mode === 'weekly') return weekly(recs).map(function(w){ return {k:w.start, end:w.end, energy:w.energy, sleep:w.sleep, weekly:true, n:w.logged}; });
  return recs.map(function(r){ return {k:r.k, energy:r.energy, sleep:r.sleep}; });
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawChart(canvas, pts, o){
  var dpr = o.dpr, W = o.width, H = o.height, c = o.colors;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  if(c.bg){ ctx.fillStyle = c.bg; ctx.fillRect(0,0,W,H); }
  var fs = o.font || 11;
  var pd = {l:fs*2.4, r:fs*0.8, t:fs*0.8, b:fs*2.2}, pw = W - pd.l - pd.r, ph = H - pd.t - pd.b, n = pts.length, yMax = 12;
  function x(i){ return pd.l + (n <= 1 ? pw/2 : i*pw/(n-1)); }
  function y(v){ return pd.t + ph - Math.min(v, yMax)/yMax*ph; }
  ctx.font = fs + 'px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  ctx.lineWidth = 1;
  for(var v = 0; v <= yMax; v += 2){
    var yy = Math.round(y(v)) + 0.5;
    ctx.strokeStyle = c.grid; ctx.beginPath(); ctx.moveTo(pd.l, yy); ctx.lineTo(W - pd.r, yy); ctx.stroke();
    ctx.fillStyle = c.muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(String(v), pd.l - fs*0.6, yy);
  }
  var ticks = Math.min(n, Math.max(2, Math.floor(pw / (fs*6.5))));
  ctx.textBaseline = 'top';
  for(var j = 0; j < ticks; j++){
    var i = ticks === 1 ? 0 : Math.round(j*(n-1)/(ticks-1));
    ctx.textAlign = n === 1 ? 'center' : j === 0 ? 'left' : j === ticks-1 ? 'right' : 'center';
    ctx.fillText(fmtShort(pts[i].k), x(i), H - pd.b + fs*0.7);
  }
  var any = pts.some(function(p){ return p.energy != null || p.sleep != null; });
  if(!any){ ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('No entries in this range', W/2, pd.t + ph/2); return {x:x, pd:pd, n:n}; }
  function series(key, color){
    var lw = o.lineWidth || 2.25;
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); var pen = false;
    pts.forEach(function(p, i){ var val = p[key]; if(val == null){ pen = false; return; } if(!pen){ ctx.moveTo(x(i), y(val)); pen = true; } else ctx.lineTo(x(i), y(val)); });
    ctx.stroke();
    ctx.fillStyle = color;
    var showAll = n <= 45, r = n <= 14 ? lw*1.6 : lw*1.2;
    pts.forEach(function(p, i){
      var val = p[key]; if(val == null) return;
      var lone = (i === 0 || pts[i-1][key] == null) && (i === n-1 || pts[i+1][key] == null);
      if(showAll || lone){ ctx.beginPath(); ctx.arc(x(i), y(val), r, 0, Math.PI*2); ctx.fill(); }
    });
  }
  series('sleep', c.sleep); series('energy', c.energy);
  if(o.hi != null && pts[o.hi]){
    var hx = x(o.hi), p = pts[o.hi];
    ctx.strokeStyle = c.muted; ctx.lineWidth = 1; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(hx, pd.t); ctx.lineTo(hx, pd.t+ph); ctx.stroke(); ctx.setLineDash([]);
    [['sleep', c.sleep], ['energy', c.energy]].forEach(function(s){
      if(p[s[0]] == null) return;
      ctx.beginPath(); ctx.arc(hx, y(p[s[0]]), 5.5, 0, Math.PI*2); ctx.fillStyle = c.surface; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = s[1]; ctx.stroke();
    });
  }
  return {x:x, pd:pd, n:n, pw:pw};
}
var chartGeom = null, chartPts = null;
function drawScreenChart(){
  var cv = $('#chart'); if(!cv) return;
  var rg = resolveRange(), recs = rangeRecs(rg.from, rg.to);
  chartPts = chartPoints(recs, chartModeFor(recs));
  if(state.hi != null && state.hi >= chartPts.length) state.hi = null;
  chartGeom = drawChart(cv, chartPts, {dpr:window.devicePixelRatio || 1, width:cv.clientWidth, height:cv.clientHeight, hi:state.hi,
    colors:{grid:cssVar('--grid'), muted:cssVar('--muted'), energy:cssVar('--energy'), sleep:cssVar('--sleep'), surface:cssVar('--surface')}});
  updateReadout();
}
function updateReadout(){
  var el = $('#readout'); if(!el || state.hi == null || !chartPts) return;
  var p = chartPts[state.hi];
  el.textContent = (p.weekly ? 'Week of ' + fmtShort(p.k) + ' (' + p.n + ' logged)' : fmtMed(p.k)) + ' · Energy ' + (p.energy == null ? '–' : n1(p.energy)) + ' · Sleep ' + fmtHrs(p.sleep);
}
function chartPointer(e){
  var cv = e.target; if(!chartGeom || !chartPts || !chartPts.length) return;
  var rect = cv.getBoundingClientRect(), px = e.clientX - rect.left, g = chartGeom;
  var i = g.n <= 1 ? 0 : Math.round((px - g.pd.l) / (g.pw/(g.n-1)));
  i = Math.max(0, Math.min(g.n-1, i));

function saveMorning(){

  if(!bed || !wake){ toast('Add both bedtime and wake time'); return; }
  var k = state.logDate, e = db.days[k] || (db.days[k] = {});
  var isNew = !e.morning;
  e.morning = {bed:bed, wake:wake, energy:+$('#energy').value, note:$('#mNote').value.trim(), updatedAt:new Date().toISOString()};
  if(persist()){ requestPersistentStorage(); toast(isNew ? 'Morning saved ✓' : 'Morning updated ✓'); render(); }
}
function saveEvening(){
  var meals = $$('#meals .meal').map(function(r){ return {type:r.dataset.type, text:$('input', r).value.trim()}; });
  var sv = $('#screen').dataset.val;
  var k = state.logDate, e = db.days[k] || (db.days[k] = {});
  var isNew = !e.evening;
  e.evening = {meals:meals, caffeine:+$('#st-caffeine output').textContent, alcohol:+$('#st-alcohol output').textContent,
    screen:sv === 'true' ? true : sv === 'false' ? false : null, note:$('#eNote').value.trim(), updatedAt:new Date().toISOString()};
  if(persist()){ requestPersistentStorage(); toast(isNew ? 'Evening saved ✓' : 'Evening updated ✓'); render(); }
}
function deleteHalf(half){

  ask('Delete ' + half + ' entry?', fmtLong(k) + '. This can’t be undone.', [{label:'Delete', value:true, cls:'danger'}, {label:'Cancel', value:false}]).then(function(ok){

  });
}
function deleteDay(k){
  ask('Delete ' + fmtMed(k) + '?', 'Removes both morning and evening entries for this day.', [{label:'Delete day', value:true, cls:'danger'}, {label:'Cancel', value:false}]).then(function(ok){
    if(!ok) return; delete db.days[k]; if(persist()){ toast('Day deleted'); render(); }
  });
}
function addMeal(type){
  var list = $('#meals');
  var empty = $$('.meal', list).filter(function(r){ return r.dataset.type === type && !$('input', r).value.trim(); })[0];
  if(empty){ $('input', empty).focus(); return; }
  list.insertAdjacentHTML('beforeend', mealRow({type:type, text:''}));
  list.lastElementChild.querySelector('input').focus();
}
function step(id, dir){
  var box = $('#st-' + id), out = $('output', box), s = +box.dataset.step;
  var v = Math.max(0, Math.min(30, Math.round((+out.textContent + dir*s)*10)/10));
  out.textContent = fmtNum(v);
}

/* files */
function isTouch(){ return window.matchMedia && matchMedia('(pointer:coarse)').matches; }
function saveFile(blob, name){
  try{
    var file = new File([blob], name, {type:blob.type});
    if(isTouch() && navigator.canShare && navigator.canShare({files:[file]})){
      return navigator.share({files:[file], title:name}).then(function(){ return true; }, function(err){
        if(err && err.name === 'AbortError') return false;
        download(blob, name); return true;
      });
    }
  }catch(e){}
  download(blob, name); return Promise.resolve(true);
}
function download(blob, name){
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function exportJSON(){
  var now = new Date().toISOString();
  var data = {app:'energy-log', version:1, exportedAt:now, days:db.days, meta:Object.assign({}, db.meta, {lastBackup:now})};
  var blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  saveFile(blob, 'energy-log-backup-' + todayKey() + '.json').then(function(ok){
    if(!ok) return;
    db.meta.lastBackup = now; db.meta.snoozeUntil = null;
    persist(); toast('Backup saved ✓'); render();
  });
}
function importJSON(file){
  file.text().then(function(text){
    var data;
    try{ data = normalize(JSON.parse(text)); }catch(e){ toast('That file isn’t a valid Energy Log backup'); return; }
    var n = Object.keys(data.days).length;
    return ask('Import ' + n + ' ' + (n === 1 ? 'day' : 'days') + '?', 'Merge keeps your current entries and adds anything missing (newer edits win). Replace deletes what’s here first.',
      [{label:'Merge', value:'merge', cls:'primary'}, {label:'Replace everything', value:'replace', cls:'danger'}, {label:'Cancel', value:null}]).then(function(mode){
      if(!mode) return;
      if(mode === 'replace'){ db = {version:1, days:data.days, meta:Object.assign({}, db.meta, {lastBackup:data.meta.lastBackup || db.meta.lastBackup})}; }
      else {
        Object.keys(data.days).forEach(function(k){
          var cur = db.days[k] || {}, inc = data.days[k];
          ['morning','evening'].forEach(function(h){
            if(!inc[h]) return;
            if(!cur[h] || (inc[h].updatedAt || '') > (cur[h].updatedAt || '')) cur[h] = inc[h];
          });
          db.days[k] = cur;
        });
        if((data.meta.lastBackup || '') > (db.meta.lastBackup || '')) db.meta.lastBackup = data.meta.lastBackup;
      }
      if(persist()){ toast('Imported ' + n + ' days ✓'); render(); }
    });
  });
}

/* ---------- PDF report ---------- */
function pdfSafe(s){
  return String(s == null ? '' : s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—−]/g, '-').replace(/…/g, '...').replace(/·/g, '|')
    .replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, '');
}
function makePDF(){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast('PDF library failed to load'); return; }
  var jsPDF = window.jspdf.jsPDF;
  var rg = resolveRange(), recs = rangeRecs(rg.from, rg.to), s = summary(recs), wk = weekly(recs), bw = bestWorst(recs), pats = patterns(recs);
  var doc = new jsPDF({unit:'mm', format:'a4', compress:true});
  var M = 14, PW = 210, PH = 297, CW = PW - 2*M, y = M;
  var INK = [29,31,35], MUTED = [104,108,115], LINE = [227,224,216], ACC = [47,125,109], EN = [217,122,30], SL = [79,99,214], RED = [184,64,58];
  function color(c){ doc.setTextColor(c[0], c[1], c[2]); }
  function font(style, size){ doc.setFont('helvetica', style); doc.setFontSize(size); }
  function text(t, x, yy, o){ doc.text(pdfSafe(t), x, yy, o); }
  function ensure(h){ if(y + h > PH - M - 8){ doc.addPage(); y = M; return true; } return false; }
  function heading(t){ ensure(16); font('bold', 13); color(INK); text(t, M, y + 5); y += 9; }

  // title
  font('bold', 22); color(INK); text('Energy Report', M, y + 7);
  font('normal', 10); color(MUTED);
  text(fmtFull(rg.from) + '  to  ' + fmtFull(rg.to) + '   |   ' + s.days + ' days, ' + s.logged + ' logged', M, y + 14);
  text('Generated ' + new Date().toLocaleString(LOCALE, {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}), PW - M, y + 7, {align:'right'});
  y += 22;

  // averages tiles
  var tiles = [['Avg energy', n1(s.energy) + ' /10', EN], ['Avg sleep', fmtHrs(s.sleep), SL], ['Avg caffeine', n1(s.caffeine) + ' /day', INK], ['Avg alcohol', n1(s.alcohol) + ' u/day', INK], ['Late screens', s.screenPct == null ? '-' : Math.round(s.screenPct) + '%', INK]];
  var tw = (CW - 4*3) / 5;
  tiles.forEach(function(t, i){
    var x = M + i*(tw + 3);
    doc.setDrawColor(LINE[0], LINE[1], LINE[2]); doc.setFillColor(250, 249, 246); doc.roundedRect(x, y, tw, 18, 2.5, 2.5, 'FD');
    font('normal', 8); color(MUTED); text(t[0], x + 3, y + 5.5);
    font('bold', 13); color(t[2]); text(t[1], x + 3, y + 13.5);
  });
  y += 25;

  // chart
  var mode = chartModeFor(recs);
  heading('Energy vs sleep' + (mode === 'weekly' ? ' (weekly averages)' : ' (daily)'));
  y += 1.5;
  font('normal', 9); doc.setDrawColor(EN[0], EN[1], EN[2]); doc.setLineWidth(0.8); doc.line(M, y - 1, M + 6, y - 1);
  color(MUTED); text('Energy (1-10)', M + 8, y);
  doc.setDrawColor(SL[0], SL[1], SL[2]); doc.line(M + 36, y - 1, M + 42, y - 1); text('Sleep (hours)', M + 44, y);
  doc.setLineWidth(0.2);
  y += 3;
  var cv = document.createElement('canvas'), cwPx = 900, chPx = 360;
  drawChart(cv, chartPoints(recs, mode), {dpr:2, width:cwPx, height:chPx, font:15, lineWidth:3,
    colors:{bg:'#ffffff', grid:'#e9e6df', muted:'#686c73', energy:'#d97a1e', sleep:'#4f63d6', surface:'#ffffff'}});
  var chH = CW * chPx / cwPx;
  doc.addImage(cv.toDataURL('image/png'), 'PNG', M, y, CW, chH);
  y += chH + 6;

  // best vs worst
  if(bw){
    ensure(60);
    heading('Best vs worst energy day');
    var bwW = (CW - 6) / 2;
    var sides = [['BEST', bw.best, ACC, [230,243,239]], ['WORST', bw.worst, RED, [250,232,229]]].map(function(sd){
      var lines = [];
      preceded(sd[1]).forEach(function(p){ lines.push({l:p[0], v:doc.setFont('helvetica','normal').setFontSize(9).splitTextToSize(pdfSafe(p[1]), bwW - 8)}); });
      var h = 22 + lines.reduce(function(a, l){ return a + 4.2 + l.v.length*4.2; }, 0) + 2;
      return {sd:sd, lines:lines, h:h};
    });
    var bh = Math.max(sides[0].h, sides[1].h);
    ensure(bh);
    sides.forEach(function(o, i){
      var x = M + i*(bwW + 6), yy = y, sd = o.sd;
      doc.setFillColor(sd[3][0], sd[3][1], sd[3][2]); doc.roundedRect(x, yy, bwW, bh, 3, 3, 'F');
      font('bold', 8); color(sd[2]); text(sd[0], x + 4, yy + 6);
      font('bold', 16); color(INK); text('Energy ' + sd[1].energy, x + 4, yy + 13.5);
      font('normal', 9); color(MUTED); text(fmt(sd[1].k, {weekday:'long', day:'numeric', month:'long', year:'numeric'}), x + 4, yy + 19);
      yy += 24;
      o.lines.forEach(function(l){
        font('bold', 8); color(MUTED); text(l.l, x + 4, yy); yy += 4.2;
        font('normal', 9); color(INK); doc.text(l.v, x + 4, yy); yy += l.v.length*4.2;
      });
    });
    y += bh + 8;
  }

  // weekly table
  heading('Week-by-week trend');
  table([{h:'Week', w:44}, {h:'Logged', w:18, a:'right'}, {h:'Avg sleep', w:24, a:'right'}, {h:'Sleep chg', w:22, a:'right'}, {h:'Avg energy', w:24, a:'right'}, {h:'Energy chg', w:22, a:'right'}, {h:'Caffeine', w:28, a:'right'}],
    wk.map(function(w){ return [fmtShort(w.start) + ' - ' + fmtShort(w.end), w.logged + '/' + w.days, fmtHrs(w.sleep), sgn(w.dSleep, true), n1(w.energy), sgn(w.dEnergy), n1(w.caffeine)]; }));
  y += 6;

  // patterns
  var okPats = pats.filter(function(p){ return p.ok; });
  if(okPats.length){
    heading('Patterns (average morning energy)');
    table([{h:'Factor', w:70}, {h:'Group A', w:56}, {h:'Group B', w:56}],
      okPats.map(function(p){ return [p.title, p.a.label + ': ' + n1(p.a.avg) + '  (' + p.a.n + 'd)', p.b.label + ': ' + n1(p.b.avg) + '  (' + p.b.n + 'd)']; }));
    font('italic', 8); color(MUTED); ensure(6); text('Correlations only - not proof of cause.', M, y + 3); y += 9;
  }

  // daily table
  heading('Daily log');
  table([{h:'Date', w:22}, {h:'Bed', w:11}, {h:'Wake', w:11}, {h:'Sleep', w:15, a:'right'}, {h:'Energy', w:12, a:'right'}, {h:'Caff', w:10, a:'right'}, {h:'Alc', w:9, a:'right'}, {h:'Scr', w:9}, {h:'Meals', w:48, wrap:true}, {h:'Notes', w:35, wrap:true}],
    recs.map(function(r){
      var notes = [r.m && r.m.note, r.ev && r.ev.note].filter(Boolean).join(' / ');
      return [fmt(r.k, {weekday:'short', day:'numeric', month:'short'}), r.m ? r.m.bed : '-', r.m ? r.m.wake : '-', r.sleepMin != null ? fmtDur(r.sleepMin) : '-',
        r.energy != null ? String(r.energy) : '-', r.ev ? fmtNum(r.caffeine) : '-', r.ev ? fmtNum(r.alcohol) : '-', r.ev && r.screen != null ? (r.screen ? 'Y' : 'N') : '-',
        r.ev ? (mealsText(r.ev, '; ') || '-') : '-', notes || ''];
    }), 8);

  // footer
  var pages = doc.getNumberOfPages();
  for(var p = 1; p <= pages; p++){
    doc.setPage(p); font('normal', 8); color(MUTED);
    text('Energy Log  |  ' + fmtFull(rg.from) + ' to ' + fmtFull(rg.to), M, PH - 8);
    text('Page ' + p + ' of ' + pages, PW - M, PH - 8, {align:'right'});
  }

  function sgn(d, hours){ if(d == null) return '-'; var r = Math.round(d*10)/10; if(hours){ var m = Math.round(d*60); return (m > 0 ? '+' : m < 0 ? '-' : '') + Math.abs(m) + 'm'; } return (r > 0 ? '+' : '') + r.toFixed(1); }
  function table(cols, rows, fsz){
    fsz = fsz || 9;
    var lh = fsz * 0.42, padY = 1.6;
    function head(){
      doc.setFillColor(239,237,231); doc.rect(M, y, CW, lh + 2*padY + 0.6, 'F');
      font('bold', fsz - 0.5); color(MUTED);
      var x = M; cols.forEach(function(c){ text(c.h, c.a === 'right' ? x + c.w - 1.5 : x + 1.5, y + padY + lh*0.85, c.a === 'right' ? {align:'right'} : undefined); x += c.w; });
      y += lh + 2*padY + 0.6;
    }
    ensure(lh*3 + 8); head();
    rows.forEach(function(row, ri){
      font('normal', fsz);
      var cells = row.map(function(v, i){ var c = cols[i], t = pdfSafe(v); if(c.wrap) return doc.splitTextToSize(t, c.w - 3).slice(0, 4); var a = doc.splitTextToSize(t, c.w - 3); return [a.length > 1 ? a[0].replace(/.{0,2}$/, '..') : a[0] || '']; });
      var nl = Math.max.apply(null, cells.map(function(c){ return c.length; }));
      var h = nl*lh + 2*padY;
      if(ensure(h)) head();
      if(ri % 2 === 1){ doc.setFillColor(250,249,246); doc.rect(M, y, CW, h, 'F'); }
      font('normal', fsz); color(INK);
      var x = M;
      cells.forEach(function(lines, i){
        var c = cols[i];
        doc.text(lines, c.a === 'right' ? x + c.w - 1.5 : x + 1.5, y + padY + lh*0.85, {align:c.a === 'right' ? 'right' : 'left', lineHeightFactor:1.15});
        x += c.w;
      });
      y += h;
      doc.setDrawColor(LINE[0], LINE[1], LINE[2]); doc.line(M, y, M + CW, y);
    });
  }

  var blob = doc.output('blob');
  saveFile(blob, 'energy-report-' + rg.from + '_to_' + rg.to + '.pdf').then(function(ok){ if(ok) toast('Report ready ✓'); });
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if(!t) return;
  var a = t.dataset.act;
  switch(a){
    case 'nav': if(t.dataset.view === 'log'){ state.logDate = todayKey(); state.half = null; } go(t.dataset.view); break;
    case 'day': { var nk = addDays(state.logDate, +t.dataset.n); if(nk <= todayKey()) openDay(nk); break; }
    case 'go-today': openDay(todayKey()); break;
    case 'half': state.half = t.dataset.half; $('#fMorning').classList.toggle('hidden', state.half !== 'morning'); $('#fEvening').classList.toggle('hidden', state.half !== 'evening'); $$('.seg [data-act=half]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.half === state.half); }); break;
    case 'open-day': openDay(t.dataset.k, t.dataset.half); break;
    case 'meal-add': addMeal(t.dataset.type); break;
    case 'meal-del': t.closest('.meal').remove(); break;
    case 'step': step(t.dataset.id, +t.dataset.dir); break;
    case 'screen': { var box = $('#screen'), v = box.dataset.val === t.dataset.val ? '' : t.dataset.val; box.dataset.val = v; $$('button', box).forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.val === v); }); break; }
    case 'del-half': deleteHalf(t.dataset.half); break;
    case 'del-day': deleteDay(t.dataset.k); break;
    case 'month': { var p = state.histMonth.split('-').map(Number), d = new Date(p[0], p[1]-1 + +t.dataset.n, 1); state.histMonth = ymd(d).slice(0,7); render(); break; }
    case 'hist-mode': state.histMode = t.dataset.mode; state.histLimit = 60; render(); break;
    case 'hist-more': state.histLimit += 60; render(); break;
    case 'range': state.range.preset = t.dataset.p; if(t.dataset.p === 'custom' && !state.range.from){ var r = {from:addDays(todayKey(),-29), to:todayKey()}; state.range.from = r.from; state.range.to = r.to; } state.chartMode = 'auto'; state.hi = null; render(); break;
    case 'chart-mode': state.chartMode = t.dataset.mode; state.hi = null; render(); break;
    case 'pdf': t.disabled = true; setTimeout(function(){ try{ makePDF(); }catch(err){ console.error(err); toast('Couldn’t build the PDF'); } t.disabled = false; }, 30); break;
    case 'export': exportJSON(); break;
    case 'import': $('#importFile').click(); break;
    case 'snooze': db.meta.snoozeUntil = new Date(Date.now() + SNOOZE_DAYS*864e5).toISOString(); persist(); render(); break;
    case 'clear-all':
      ask('Delete everything?', 'All ' + sortedKeys().length + ' logged days on this device will be erased. Export a backup first if you might want them.', [{label:'Export backup first', value:'export', cls:'primary'}, {label:'Delete everything', value:'delete', cls:'danger'}, {label:'Cancel', value:null}]).then(function(v){
        if(v === 'export') exportJSON();
        else if(v === 'delete'){ db = blank(); persist(); toast('All data deleted'); render(); }
      });
      break;
  }
});
document.addEventListener('submit', function(e){
  e.preventDefault();
  if(e.target.id === 'fMorning') saveMorning();
  else if(e.target.id === 'fEvening') saveEvening();
});
document.addEventListener('input', function(e){
  var id = e.target.id;
  if(id === 'energy') syncEnergy();
  else if(id === 'bed' || id === 'wake') $('#sleepOut').innerHTML = sleepLabel(sleepMins($('#bed').value, $('#wake').value));
});
document.addEventListener('change', function(e){
  var id = e.target.id;
  if(id === 'pickDate' && e.target.value){ var v = e.target.value > todayKey() ? todayKey() : e.target.value; openDay(v); }
  else if(id === 'rFrom' || id === 'rTo'){ if(e.target.value){ state.range[id === 'rFrom' ? 'from' : 'to'] = e.target.value; state.hi = null; render(); } }
  else if(id === 'importFile'){ var f = e.target.files[0]; e.target.value = ''; if(f) importJSON(f); }
});
document.addEventListener('pointerdown', function(e){ if(e.target.id === 'chart') chartPointer(e); });
document.addEventListener('pointermove', function(e){ if(e.target.id === 'chart' && (e.pointerType === 'mouse' || e.buttons)) chartPointer(e); });
document.addEventListener('keydown', function(e){
  // keep Enter in a meal field from submitting the form half-filled
  if(e.key === 'Enter' && e.target.closest && e.target.closest('.meal')){ e.preventDefault(); e.target.blur(); }
});
var resizeTimer;
window.addEventListener('resize', function(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(function(){ if(state.view === 'dash') drawScreenChart(); }, 120); });
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if(state.view === 'dash') drawScreenChart(); });
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState !== 'visible') return;
  var t = todayKey();
  if(t !== state.lastToday){
    if(state.view === 'log' && state.logDate === state.lastToday){ state.logDate = t; state.half = null; }
    state.lastToday = t; render();
  }
});
window.addEventListener('storage', function(e){ if(e.key === KEY){ db = load(); keysCache = null; render(); } });

/* home-screen icon (iOS needs a PNG) */
try{
  var ic = document.createElement('canvas'); ic.width = ic.height = 180;
  var g = ic.getContext('2d'); g.fillStyle = '#2f7d6d'; g.fillRect(0,0,180,180);
  g.fillStyle = '#fff'; g.beginPath(); [[101,22],[50,101],[84,101],[73,158],[129,73],[95,73]].forEach(function(p, i){ i ? g.lineTo(p[0],p[1]) : g.moveTo(p[0],p[1]); }); g.closePath(); g.fill();
  var link = document.createElement('link'); link.rel = 'apple-touch-icon'; link.href = ic.toDataURL('image/png'); document.head.appendChild(link);
}catch(e){}

/* optional service worker when hosted over http(s) next to sw.js */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

render();
window.__energyLog = {get db(){ return db; }, reload:function(){ db = load(); keysCache = null; render(); }};
})();
